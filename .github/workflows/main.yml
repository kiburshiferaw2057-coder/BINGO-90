name: Build BINGO ET Android (Java & Kotlin)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Sync web assets into Android project
        run: |
          if [ -d "android" ]; then
            mkdir -p android/app/src/main/assets/public
            for f in index.html styles.css app.js manifest.json sw.js; do
              [ -f "$f" ] && cp "$f" android/app/src/main/assets/public/
            done
          fi

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f "android/gradlew" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -d "android" ]; then
            cd android
            gradle assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bingo-et-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
