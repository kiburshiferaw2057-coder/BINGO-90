name: Build BINGO ET Android (Java & Kotlin)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Prepare assets and resources
        run: |
          if [ -d "android" ]; then
            PUB_DIR="android/app/src/main/assets/public"
            mkdir -p "$PUB_DIR/assets"
            for f in index.html styles.css app.js manifest.json sw.js; do
              [ -f "$f" ] && cp "$f" "$PUB_DIR/"
            done
            [ -d "assets" ] && cp -r assets/* "$PUB_DIR/assets/" 2>/dev/null || true

            # Create valid 1x1 PNG placeholders if icon files are missing so WebView & MergeResources never fail
            python3 - << 'PY'
          import base64, os
          png_b64 = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
          raw = base64.b64decode(png_b64)
          for p in [
              "android/app/src/main/assets/public/assets/bingo-et-icon.png",
              "android/app/src/main/assets/public/assets/bingo-et-icon-192.png",
              "android/app/src/main/assets/public/assets/bingo-et-icon-512.png",
          ]:
              os.makedirs(os.path.dirname(p), exist_ok=True)
              if not os.path.exists(p) or os.path.getsize(p) == 0:
                  with open(p, "wb") as f:
                      f.write(raw)
          PY

            SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
            echo "sdk.dir=${SDK_DIR}" > android/local.properties
          fi

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -f "android/gradlew" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -d "android" ]; then
            cd android
            gradle assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bingo-et-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
